<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc">
<title id="title">BillVault: your money, in view</title><desc id="desc">An open-source personal bill tracker, illustrated with a receipt and spending chart.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#463aaa"/><stop offset="1" stop-color="#7c68e8"/></linearGradient></defs>
<rect width="1280" height="350" rx="24" fill="url(#bg)"/>
<circle cx="1190" cy="40" r="235" fill="#fff" opacity=".04"/><circle cx="1020" cy="350" r="270" fill="#fff" opacity=".04"/>
<rect x="56" y="45" width="48" height="48" rx="14" fill="#fff"/><text x="69" y="80" fill="#6654cf" font-family="Arial,sans-serif" font-size="33" font-weight="bold">B</text>
<text x="120" y="79" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">BillVault</text>
<text x="56" y="155" fill="#ddd6ff" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">A LITTLE CLARITY. EVERY MONTH.</text>
<text x="56" y="214" fill="#fff" font-family="Arial,sans-serif" font-size="48" font-weight="bold" letter-spacing="-1">Your money, in view.</text>
<text x="56" y="253" fill="#e2dcff" font-family="Arial,sans-serif" font-size="18">Track bills. Understand subscriptions. Keep your data yours.</text>
<rect x="56" y="283" width="115" height="29" rx="14" fill="#fff" opacity=".12"/><text x="74" y="303" fill="#fff" font-family="Arial,sans-serif" font-size="12">OPEN SOURCE</text>
