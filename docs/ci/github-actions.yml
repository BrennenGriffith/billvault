name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: billvault_test
          POSTGRES_USER: billvault
          POSTGRES_PASSWORD: ci-disposable-database-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U billvault -d billvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Frontend install, tests, production build and dependency check
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit
      - name: Maven verification with H2
        run: ./mvnw -B verify
      - name: Integration suite with PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/billvault_test
          TEST_DB_USER: billvault
          TEST_DB_PASSWORD: ci-disposable-database-only
        run: ./mvnw -B test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the isolated Compose stack
        env:
          DB_PASSWORD: ci-disposable-database-only
          ADMIN_PASSWORD: ci-disposable-administrator-only
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify frontend and protected API
        run: |
          curl --fail http://127.0.0.1:8088/ | grep -q '<title>BillVault'
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/expenses)
          test "$status" = "401"
      - name: Diagnostics
        if: failure()
        env:
          DB_PASSWORD: ci-disposable-database-only
          ADMIN_PASSWORD: ci-disposable-administrator-only
        run: docker compose logs --tail 100
      - name: Stop disposable test services
        if: always()
        env:
          DB_PASSWORD: ci-disposable-database-only
          ADMIN_PASSWORD: ci-disposable-administrator-only
        run: docker compose down --volumes
