spring.application.name=billvault
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billvault}
spring.datasource.username=${DB_USER:billvault}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
billvault.admin.username=${ADMIN_USERNAME:admin}
billvault.admin.password=${ADMIN_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.profiles.group.personal=local
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
