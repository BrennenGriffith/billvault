name: Feature request
description: Suggest a focused improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Self-hosted web app
        - JavaFX desktop
        - MCP / import skill
        - Packaging / installation
        - Documentation / accessibility
        - Other
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What problem would this solve?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior and alternatives}
    validations: {required: true}
